name: E2E

# Playwright E2E — 로컬 supabase(Docker) + seed + dev 서버(:3100)로 핵심 사슬 검증.
# 무겁기 때문에 main PR/push + 수동 실행에서만 구동. 단위(CI)와 분리.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: playwright (supabase + dev server)
    runs-on: ubuntu-latest
    env:
      # dev 서버(webServer.env가 process.env를 상속)·세션 서명용 더미 시크릿 (E2E 전용·운영 무관).
      # 마스터 해시·CRON_SECRET은 globalSetup이 .env.development.local에 결정적으로 주입한다.
      # (CRON_SECRET을 여기 두면 process.env가 우선이라 cron-auth 스펙의 주입값과 불일치 → 제거.)
      MASTER_SESSION_SECRET: e2e-master-session-secret-not-a-real-secret-000
      OPERATOR_SESSION_SECRET: e2e-operator-session-secret-not-a-real-secret-0
      PASSENGER_SESSION_SECRET: e2e-passenger-session-secret-not-a-real-secret
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase (local stack)
        run: supabase start

      - name: Load migrations + seed (db reset)
        run: supabase db reset

      - name: Write local supabase env (.env.development.local)
        # next dev(:3100)·E2E 픽스처가 "로컬 supabase"를 보도록 오버라이드.
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } > .env.development.local

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E
        run: pnpm test:e2e

      - name: Upload Playwright report (always)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload traces/videos on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7

      - name: Stop Supabase
        if: ${{ always() }}
        run: supabase stop || true
