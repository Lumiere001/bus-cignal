name: depart-reminder

# 출발 리마인더 외부 스케줄러.
# Vercel Hobby는 cron 2개 한도(payment-reminder·anonymize로 가득)라, 출발 알림은
# GitHub Actions cron이 우리 엔드포인트를 호출해 처리한다(무료·Vercel 한도 무관).
#
# ⚠️ 사전 설정(1회): 저장소 Settings → Secrets and variables → Actions →
#    New repository secret 에 CRON_SECRET 추가 (Vercel의 CRON_SECRET과 동일 값).

on:
  schedule:
    # 매시 정각(UTC). 출발 24h 윈도우 + 매칭별 1회(멱등)라 시간 단위면 충분.
    - cron: "0 * * * *"
  workflow_dispatch: {}

# 동시 실행 방지(겹쳐도 멱등하지만 불필요한 중복 호출 차단).
concurrency:
  group: depart-reminder
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call depart-reminder endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET 저장소 시크릿이 없습니다. Settings→Secrets에 추가하세요."
            exit 1
          fi
          curl -fsS --max-time 60 -X GET \
            "https://bus-cignal.vercel.app/api/cron/depart-reminder" \
            -H "Authorization: Bearer ${CRON_SECRET}"

  # ping 실패 시(엔드포인트 5xx·CRON_SECRET 누락·타임아웃) → GitHub 이슈 자동 생성/갱신.
  notify-failure:
    needs: ping
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or append failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="🚨 [cron] depart-reminder 실패"
          BODY=$(printf '출발 리마인더 워크플로가 실패했습니다 — 학생/간사 출발 알림이 누락됐을 수 있습니다.\n\n- 실행 로그: %s\n- 시각(UTC): %s\n\n점검: 엔드포인트 응답·CRON_SECRET 시크릿·Vercel 배포 상태.' "$RUN_URL" "$(date -u +%FT%TZ)")
          gh label create ops-auto --color B60205 --description "자동 운영 알림" 2>/dev/null || true
          NUM=$(gh issue list --state open --search "$TITLE in:title" \
                  --json number,title --jq "map(select(.title==\"$TITLE\")) | .[0].number // empty")
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "🔁 재발생$(printf '\n\n')$BODY"
          else
            gh issue create --title "$TITLE" --label ops-auto --body "$BODY"
          fi
